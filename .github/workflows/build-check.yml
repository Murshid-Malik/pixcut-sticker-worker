name: Diagnose worker build
on:
  push:
    branches: [codex/build-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disposable runner disk for model layers
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Build the exact Serverless image without publishing or deploying
        run: docker build --platform linux/amd64 --progress plain -t pixcut-build-check .
