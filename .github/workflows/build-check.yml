name: Build and publish PixCut worker
on:
  push:
    branches: [codex/build-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disposable runner disk for model layers
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and validate the Serverless image
        run: |
          docker build --platform linux/amd64 --progress plain \
            --label org.opencontainers.image.source=https://github.com/Murshid-Malik/pixcut-sticker-worker \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t ghcr.io/murshid-malik/pixcut-sticker-worker:sha-$GITHUB_SHA .
      - name: Publish validated image
        run: |
          docker push ghcr.io/murshid-malik/pixcut-sticker-worker:sha-$GITHUB_SHA
          echo "Image: ghcr.io/murshid-malik/pixcut-sticker-worker:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
